$kind: http-request
url: "{{baseUrl}}/api/clients/{{clientId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Trabelsi",
      "prenom": "Amine",
      "email": "amine.trabelsi@example.com",
      "telephone": "99000000",
      "numPermis": "TN-123456",
      "dateInscription": "2026-11-02"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
