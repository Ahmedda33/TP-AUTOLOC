$kind: http-request
url: "{{baseUrl}}/api/clients"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Trabelsi",
      "prenom": "Amine",
      "email": "amine.trabelsi@example.com",
      "telephone": "22000000",
      "numPermis": "TN-123456",
      "dateInscription": "2026-11-02",
      "idClient": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
