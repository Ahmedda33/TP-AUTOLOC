$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "immatriculation": "321-TU-654",
      "marque": "Renault",
      "modele": "Clio 5",
      "categorie": "CITADINE",
      "tarifJournalier": 90.0,
      "statut": "DISPONIBLE",
      "agence": { "idAgence": {{agenceId}} }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("vehiculeId", pm.response.json().idVehicule);
    language: text/javascript
order: 3000
