$kind: http-request
url: "{{baseUrl}}/api/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "AutoLoc Tunis",
      "ville": "Tunis",
      "adresse": "10 Avenue Habib Bourguiba",
      "telephone": "71000000",
      "idAgence": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
