$kind: http-request
url: "{{baseUrl}}/api/agences/9999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "AutoLoc Tunis",
      "ville": "Sfax",
      "adresse": "10 Avenue Habib Bourguiba",
      "telephone": "71000000"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
