$kind: http-request
url: "{{baseUrl}}/api/agences/{{agenceId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "AutoLoc Tunis",
      "ville": "Sfax",
      "adresse": "10 Avenue Habib Bourguiba",
      "telephone": "71000000"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
