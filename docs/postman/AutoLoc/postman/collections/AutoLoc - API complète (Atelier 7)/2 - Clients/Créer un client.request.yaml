$kind: http-request
url: "{{baseUrl}}/clients"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Ben Ali",
      "prenom": "Sami",
      "email": "sami@autoloc.tn",
      "telephone": "20123456",
      "numPermis": "P123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("clientId", pm.response.json().id);
    language: text/javascript
order: 1000
