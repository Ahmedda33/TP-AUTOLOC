$kind: http-request
url: "{{baseUrl}}/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Agence Tunis Centre",
      "ville": "Tunis",
      "adresse": "Avenue Habib Bourguiba",
      "telephone": "71000000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("agenceId", pm.response.json().id);
    language: text/javascript
order: 1000
