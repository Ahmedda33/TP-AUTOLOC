$kind: http-request
url: "{{baseUrl}}/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "immatriculation": "321-TU-654",
      "marque": "Renault",
      "modele": "Clio 5",
      "categorie": "CITADINE",
      "tarifJournalier": 90.0,
      "statut": "DISPONIBLE",
      "agenceId": {{agenceId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("vehiculeId", pm.response.json().id);
    language: text/javascript
order: 1000
