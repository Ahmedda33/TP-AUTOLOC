$kind: http-request
url: "{{baseUrl}}/vehicules/{{vehiculeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "immatriculation": "321-TU-654",
      "marque": "Renault",
      "modele": "Clio 5",
      "categorie": "CITADINE",
      "tarifJournalier": 95.0,
      "statut": "DISPONIBLE",
      "agenceId": {{agenceId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
