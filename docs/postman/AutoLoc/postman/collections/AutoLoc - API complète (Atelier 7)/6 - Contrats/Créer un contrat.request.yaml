$kind: http-request
url: "{{baseUrl}}/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-11-20",
      "montantTotal": 480.0,
      "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("contratId", pm.response.json().id);
    language: text/javascript
order: 1000
