$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idReservation": 5,
      "dateDebut": "2026-11-02",
      "dateFin": "2026-11-06",
      "client": { "idClient": {{clientId}} },
      "vehicule": { "idVehicule": {{vehiculeId}} }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
