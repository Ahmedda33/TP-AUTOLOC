$kind: http-request
url: "{{baseUrl}}/api/equipements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "libelle": "GPS",
      "idEquipement": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
