$kind: http-request
url: "{{baseUrl}}/api/maintenances"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-12-01",
      "dateFin": "2026-11-30",
      "description": "Vidange et contrôle des freins",
      "vehicule": { "idVehicule": {{vehiculeId}} }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
