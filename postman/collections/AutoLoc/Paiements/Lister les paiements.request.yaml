$kind: http-request
url: "{{baseUrl}}/api/paiements"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Au moins les deux paiements du contrat", () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 1000
