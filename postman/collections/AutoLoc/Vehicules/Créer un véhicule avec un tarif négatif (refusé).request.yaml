$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "immatriculation": "321-TU-654",
      "marque": "Renault",
      "modele": "Clio 5",
      "categorie": "CITADINE",
      "tarifJournalier": -10.0,
      "statut": "DISPONIBLE",
      "agence": { "idAgence": {{agenceId}} }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
